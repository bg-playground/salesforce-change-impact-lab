name: Salesforce Code Analyzer

on:
  pull_request:
    paths:
      - "force-app/**"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Salesforce Code Analyzer v5
        id: run-code-analyzer
        continue-on-error: true
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: >-
            --workspace force-app
            --view detail
            --output-file sfca_results.json
          results-artifact-name: salesforce-code-analyzer-results
      - name: Emit release evidence
        if: always()
        env:
          ANALYZER_OUTCOME: ${{ steps.run-code-analyzer.outcome }}
          ANALYZER_EXIT_CODE: ${{ steps.run-code-analyzer.outputs.exit-code }}
          SEV1: ${{ steps.run-code-analyzer.outputs.num-sev1-violations }}
          SEV2: ${{ steps.run-code-analyzer.outputs.num-sev2-violations }}
          EVIDENCE_GIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def as_int(value):
              try:
                  return int(value or 0)
              except ValueError:
                  return 0

          exit_code = as_int(os.environ.get("ANALYZER_EXIT_CODE"))
          sev1 = as_int(os.environ.get("SEV1"))
          sev2 = as_int(os.environ.get("SEV2"))
          outcome = os.environ.get("ANALYZER_OUTCOME", "failure")
          status = "passed" if outcome == "success" and exit_code == 0 and sev1 == 0 and sev2 == 0 else "failed"
          payload = {
              "schema": "salesforce-change-impact-lab.supporting-evidence.v1",
              "source": "salesforce-code-analyzer",
              "status": status,
              "git_sha": os.environ["EVIDENCE_GIT_SHA"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "summary": {
                  "action_outcome": outcome,
                  "exit_code": exit_code,
                  "severity_1_violations": sev1,
                  "severity_2_violations": sev2,
              },
          }
          Path("evidence/code-analyzer-evidence.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-code-analyzer-release-evidence
          path: evidence/code-analyzer-evidence.json
      - name: Gate critical/high findings
        if: always()
        env:
          ANALYZER_OUTCOME: ${{ steps.run-code-analyzer.outcome }}
          ANALYZER_EXIT_CODE: ${{ steps.run-code-analyzer.outputs.exit-code }}
          SEV1: ${{ steps.run-code-analyzer.outputs.num-sev1-violations }}
          SEV2: ${{ steps.run-code-analyzer.outputs.num-sev2-violations }}
        run: |
          if [ "$ANALYZER_OUTCOME" != "success" ] || [ "${ANALYZER_EXIT_CODE:-0}" -gt 0 ] || [ "${SEV1:-0}" -gt 0 ] || [ "${SEV2:-0}" -gt 0 ]; then
            exit 1
          fi
