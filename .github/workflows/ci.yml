name: Demo CI

on:
  push:
  pull_request:

jobs:
  intent-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Prove isolated Validation Rule baseline and mutation behavior
        run: bash scripts/run-demo.sh
      - name: Prove isolated Flow baseline and mutation behavior
        shell: bash
        run: |
          FLOW="tests/fixtures/baseline/Case_Strategic_Escalation.flow-meta.xml"
          CONTRACT="policies/SF-CASE-001.json"
          python tools/flow_impact.py --flow "$FLOW" --contract "$CONTRACT" --json-out evidence/flow-baseline.json
          set +e
          python tools/flow_impact.py --flow mutations/Case_Strategic_Escalation.logic-or.flow-meta.xml --contract "$CONTRACT" --json-out evidence/flow-mutation.json
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then echo "Expected Flow semantic mutation NO-GO; got $status"; exit 1; fi
      - name: Prove isolated Permission Set baseline and mutation behavior
        shell: bash
        run: |
          PERMISSION_SET="tests/fixtures/baseline/Sales_Rep_Opportunity_Access.permissionset-meta.xml"
          CONTRACT="policies/SF-SEC-001.json"
          python tools/permission_impact.py --permission-set "$PERMISSION_SET" --contract "$CONTRACT" --json-out evidence/permission-baseline.json
          set +e
          python tools/permission_impact.py --permission-set mutations/Sales_Rep_Opportunity_Access.finance-edit.permissionset-meta.xml --contract "$CONTRACT" --json-out evidence/permission-mutation.json
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then echo "Expected Permission Set mutation NO-GO; got $status"; exit 1; fi
      - name: Prove PR-impact engine with isolated semantic fixtures
        shell: bash
        run: |
          RULE="force-app/main/default/objects/Opportunity/validationRules/High_Discount_Requires_Finance.validationRule-meta.xml"
          BASELINE="tests/fixtures/baseline/High_Discount_Requires_Finance.validationRule-meta.xml"
          python tools/pr_impact.py --changed "$RULE" --semantic-metadata "$BASELINE" --json-out evidence/pr-impact-baseline.json
          set +e
          python tools/pr_impact.py --changed "$RULE" --semantic-metadata mutations/High_Discount_Requires_Finance.threshold-30.validationRule-meta.xml --json-out evidence/pr-impact-mutation.json
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then echo "Expected semantic mutation NO-GO; got $status"; exit 1; fi
      - name: Create deterministic supporting evidence fixtures
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          code = {
              "schema": "salesforce-change-impact-lab.supporting-evidence.v1",
              "source": "salesforce-code-analyzer",
              "status": "passed",
              "git_sha": os.environ["GITHUB_SHA"],
              "run_id": "demo-fixture",
              "run_url": "demo-ci",
              "summary": {"fixture": True},
          }
          Path("evidence/code-analyzer-demo-evidence.json").write_text(json.dumps(code, indent=2) + "\n")
          PY
          python tools/apex_runtime_evidence.py \
            --status passed \
            --git-sha "$GITHUB_SHA" \
            --runtime-kind apex-tests \
            --run-id demo-fixture \
            --run-url demo-ci \
            --total 1 --passed 1 --failed 0 \
            --fixture \
            --json-out evidence/apex-runtime-demo-evidence.json
      - name: Prove BGSTM release evidence bundle
        run: >-
          python tools/bgstm_release_evidence.py
          --pr-impact evidence/pr-impact-baseline.json
          --project-id 00000000-0000-0000-0000-000000000039
          --git-sha "$GITHUB_SHA"
          --git-branch "$GITHUB_REF_NAME"
          --ci-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          --code-analyzer-evidence evidence/code-analyzer-demo-evidence.json
          --apex-runtime-evidence evidence/apex-runtime-demo-evidence.json
          --json-out evidence/bgstm-release-evidence.json
          --text-out evidence/bgstm-release-evidence.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-change-impact-evidence
          path: evidence/
